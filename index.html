<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chinese Shadowing Player</title>
  <style>
    :root {
      --bg-color: #121214;
      --sidebar-bg: #1a1a1e;
      --card-bg: #202026;
      --text-main: #f0f0f5;
      --text-sub: #a0a0b0;
      --text-played: #606070;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --active-item: #2d2b52;
      --pinyin-color: #38bdf8;
      --korean-color: #cbd5e1;
      --border-color: #2c2c35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 좌측 사이드바 */
    #sidebar {
      width: 320px;
      min-width: 300px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .close-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 20px;
      cursor: pointer;
    }

    .playlist-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .playlist-item {
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border: 1px solid transparent;
      transition: background 0.2s, color 0.2s;
    }

    .playlist-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .playlist-item.active {
      background-color: var(--active-item);
      border-color: var(--accent);
      color: #fff !important;
    }

    .playlist-item.played {
      color: var(--text-played);
      background-color: rgba(0, 0, 0, 0.2);
    }

    .playlist-item.played .item-title {
      color: var(--text-played);
    }

    .item-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-status {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #2a2a35;
      color: var(--text-sub);
      width: fit-content;
    }

    .playlist-item.played .item-status {
      background: #1e1e24;
      color: #4b4b57;
    }

    /* 메인 콘텐츠 영역 */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      width: 100%;
      height: 100%;
    }

    .top-bar {
      display: none;
      padding: 12px 16px;
      background-color: var(--sidebar-bg);
      border-bottom: 1px solid var(--border-color);
      align-items: center;
      justify-content: space-between;
    }

    .top-bar .title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }

    #script-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 100px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .script-row {
      background-color: var(--card-bg);
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s;
    }

    .script-row.active {
      border-color: var(--accent);
      background-color: #232238;
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.15);
    }

    .pinyin-text {
      font-size: 15px;
      color: var(--pinyin-color);
      margin-bottom: 4px;
      min-height: 18px;
      word-break: break-word;
    }

    .hanzi-text {
      font-size: 19px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.4;
      word-break: break-word;
    }

    .korean-text {
      font-size: 14px;
      color: var(--korean-color);
      line-height: 1.4;
      word-break: break-word;
    }

    /* 하단 플레이어 컨트롤 */
    #bottom-bar {
      height: 76px;
      background-color: var(--sidebar-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      gap: 10px;
    }

    .audio-wrapper {
      flex: 1;
    }

    audio {
      width: 100%;
      height: 36px;
      outline: none;
    }

    .btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-sub);
      padding: 20px;
      line-height: 1.6;
    }

    /* 모바일 전용 UI */
    @media (max-width: 768px) {
      #sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 85%;
        max-width: 320px;
        transform: translateX(-100%);
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
      }

      #sidebar.open {
        transform: translateX(0);
      }

      .close-btn {
        display: block;
      }

      .top-bar {
        display: flex;
      }

      #script-container {
        padding: 16px 14px 90px 14px;
      }

      .backdrop {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 90;
      }

      .backdrop.open {
        display: block;
      }
    }
  </style>
</head>
<body>

  <div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

  <!-- 사이드바 -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>학습 목록 (<span id="playlist-count">0</span>)</h2>
      <button class="close-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="playlist-container" id="playlist-items">
      <div class="empty-state">
        [재생목록] 버튼을 눌러 학습 파일들을 선택하세요.
      </div>
    </div>
  </div>

  <!-- 메인 영역 -->
  <div id="main-content">
    <div class="top-bar">
      <button class="btn" style="padding: 6px 10px;" onclick="toggleSidebar()">☰ 목록</button>
      <div class="title" id="current-title">재생할 파일을 선택하세요</div>
    </div>

    <div id="script-container">
      <div class="empty-state">
        우측 하단의 [재생목록] 버튼을 눌러<br>PC의 폴더 또는 파일(MP3, JSON)을 선택해 주세요.
      </div>
    </div>

    <!-- 하단 컨트롤바 -->
    <div id="bottom-bar">
      <div class="audio-wrapper">
        <audio id="audio-player" controls></audio>
      </div>

      <div class="action-group">
        <button class="btn" onclick="openFilePicker()">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
          </svg>
          재생목록
        </button>
        <!-- PC용 폴더 선택 & 모바일용 다중 파일 선택 통합 인풋 -->
        <input type="file" id="file-input" multiple webkitdirectory directory style="display: none;" />
      </div>
    </div>
  </div>

  <script>
    let playlist = [];
    let currentEpisodeIndex = -1;
    let currentScripts = [];

    const audioPlayer = document.getElementById("audio-player");
    const scriptContainer = document.getElementById("script-container");
    const playlistItemsContainer = document.getElementById("playlist-items");
    const playlistCountLabel = document.getElementById("playlist-count");
    const currentTitleLabel = document.getElementById("current-title");
    const fileInput = document.getElementById("file-input");
    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("backdrop");

    const STORAGE_PLAYED_KEY = "cplayer_played_records";
    const STORAGE_LAST_EPISODE_KEY = "cplayer_last_episode";
    const STORAGE_LAST_TIME_KEY = "cplayer_last_time";

    function toggleSidebar() {
      sidebar.classList.toggle("open");
      backdrop.classList.toggle("open");
    }

    function openFilePicker() {
      // iOS 사파리 환경에서는 webkitdirectory 제거 후 실행
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) {
        fileInput.removeAttribute("webkitdirectory");
        fileInput.removeAttribute("directory");
      }
      fileInput.click();
    }

    function getPlayedRecords() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_PLAYED_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function setPlayed(name) {
      const records = getPlayedRecords();
      records[name] = true;
      localStorage.setItem(STORAGE_PLAYED_KEY, JSON.stringify(records));
    }

    fileInput.addEventListener("change", async (event) => {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      const mp3Map = new Map();
      const jsonMap = new Map();

      files.forEach((file) => {
        const ext = file.name.split(".").pop().toLowerCase();
        const baseName = file.name.substring(0, file.name.lastIndexOf("."));
        if (ext === "mp3") mp3Map.set(baseName, file);
        if (ext === "json") jsonMap.set(baseName, file);
      });

      const playedRecords = getPlayedRecords();
      playlist = [];

      mp3Map.forEach((mp3File, name) => {
        if (jsonMap.has(name)) {
          playlist.push({
            name: name,
            mp3File: mp3File,
            jsonFile: jsonMap.get(name),
            played: !!playedRecords[name]
          });
        }
      });

      playlist.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

      playlistCountLabel.innerText = playlist.length;
      renderPlaylistUI();

      if (playlist.length > 0) {
        const lastEpisode = localStorage.getItem(STORAGE_LAST_EPISODE_KEY);
        const lastTime = parseFloat(localStorage.getItem(STORAGE_LAST_TIME_KEY) || "0");

        let targetIndex = playlist.findIndex((item) => item.name === lastEpisode);
        if (targetIndex === -1) targetIndex = 0;

        loadEpisode(targetIndex, false, lastTime);
      }
    });

    function renderPlaylistUI() {
      playlistItemsContainer.innerHTML = "";

      playlist.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = `playlist-item ${item.played ? "played" : ""} ${index === currentEpisodeIndex ? "active" : ""}`;
        div.onclick = () => {
          loadEpisode(index, true);
          if (window.innerWidth <= 768) toggleSidebar();
        };

        const checkMark = item.played ? "✔ " : "";
        div.innerHTML = `
          <div class="item-title" title="${item.name}">${checkMark}${item.name}</div>
          <div class="item-status">${item.played ? "학습 완료" : "미학습"}</div>
        `;
        playlistItemsContainer.appendChild(div);
      });
    }

    async function loadEpisode(index, autoPlay = true, seekTime = 0) {
      if (index < 0 || index >= playlist.length) return;
      currentEpisodeIndex = index;
      const episode = playlist[index];

      localStorage.setItem(STORAGE_LAST_EPISODE_KEY, episode.name);
      currentTitleLabel.innerText = episode.name;

      renderPlaylistUI();

      audioPlayer.src = URL.createObjectURL(episode.mp3File);
      if (seekTime > 0) {
        audioPlayer.currentTime = seekTime;
      }

      const jsonText = await episode.jsonFile.text();
      try {
        currentScripts = JSON.parse(jsonText);
      } catch (e) {
        currentScripts = [];
      }

      renderScriptsUI();

      if (autoPlay) {
        audioPlayer.play().catch(() => {});
      }
    }

    function renderScriptsUI() {
      scriptContainer.innerHTML = "";

      currentScripts.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "script-row";
        row.id = `script-${idx}`;
        row.onclick = () => {
          audioPlayer.currentTime = item.start;
          audioPlayer.play();
        };

        row.innerHTML = `
          <div class="pinyin-text">${item.pinyin || ""}</div>
          <div class="hanzi-text">${item.hanzi || ""}</div>
          <div class="korean-text">${item.korean || ""}</div>
        `;
        scriptContainer.appendChild(row);
      });
    }

    audioPlayer.addEventListener("timeupdate", () => {
      const curTime = audioPlayer.currentTime;
      localStorage.setItem(STORAGE_LAST_TIME_KEY, curTime);

      if (audioPlayer.duration && curTime / audioPlayer.duration > 0.8) {
        const episode = playlist[currentEpisodeIndex];
        if (episode && !episode.played) {
          episode.played = true;
          setPlayed(episode.name);
          renderPlaylistUI();
        }
      }

      let activeIdx = -1;
      for (let i = 0; i < currentScripts.length; i++) {
        if (curTime >= currentScripts[i].start && curTime <= currentScripts[i].end) {
          activeIdx = i;
          break;
        }
      }

      document.querySelectorAll(".script-row").forEach((el, i) => {
        if (i === activeIdx) {
          if (!el.classList.contains("active")) {
            el.classList.add("active");
            el.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        } else {
          el.classList.remove("active");
        }
      });
    });

    audioPlayer.addEventListener("ended", () => {
      const episode = playlist[currentEpisodeIndex];
      if (episode) {
        episode.played = true;
        setPlayed(episode.name);
        renderPlaylistUI();
      }

      if (currentEpisodeIndex + 1 < playlist.length) {
        loadEpisode(currentEpisodeIndex + 1, true);
      }
    });
  </script>
</body>
</html>
