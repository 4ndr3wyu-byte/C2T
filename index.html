<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3845/3845868.png">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js');
  }
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>C2T 중국어 학습 플레이어</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #030712;
      color: #f8fafc;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    
    /* 상단 80% 자막 뷰 */
    #lyrics-container {
      height: 80%;
      overflow-y: auto;
      padding: 24px 20px 60px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    #lyrics-container::-webkit-scrollbar { display: none; }

    /* 자막 카드 스타일 */
    .sentence-card {
      padding: 16px 18px;
      border-radius: 18px;
      cursor: pointer;
      opacity: 0.28;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      background-color: transparent;
    }
    .sentence-card.active {
      opacity: 1;
      background-color: #0f172a;
      border-color: rgba(16, 185, 129, 0.45);
      transform: scale(1.02);
      box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.65);
    }
    .hanzi {
      font-size: 1.45rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 4px;
      line-height: 1.35;
      letter-spacing: 0.02em;
    }
    .sentence-card.active .hanzi {
      color: #34d399;
    }
    .pinyin {
      font-size: 0.95rem;
      font-weight: 600;
      color: #6ee7b7;
      margin-bottom: 6px;
    }
    .sentence-card.active .pinyin {
      color: #fcd34d;
    }
    .korean {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    /* 토글에 따른 숨김 클래스 */
    body.hide-hanzi .hanzi { display: none; }
    body.hide-pinyin .pinyin { display: none; }
    body.hide-korean .korean { display: none; }

    /* 하단 20% 통합 컨트롤러 바 */
    footer {
      height: 20%;
      min-height: 155px;
      background-color: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(51, 65, 85, 0.6);
      padding: 10px 20px 14px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 20;
    }

    /* 옵션 바: 숨김 토글 & 배속 */
    .option-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 4px;
    }
    .toggle-group {
      display: flex;
      gap: 6px;
    }
    .btn-toggle {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-toggle.active {
      background-color: #10b981;
      border-color: #10b981;
      color: #030712;
    }
    .btn-speed {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #34d399;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 프로그레스 바 */
    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .time-text {
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: #94a3b8;
      width: 38px;
    }
    .progress-bar-bg {
      flex: 1;
      height: 6px;
      background-color: #334155;
      border-radius: 9999px;
      overflow: hidden;
      cursor: pointer;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background-color: #10b981;
      border-radius: 9999px;
      transition: width 0.1s linear;
    }

    /* 제어 버튼 그룹 */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }
    .btn-ctrl {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 12px;
      transition: all 0.15s ease;
    }
    .btn-ctrl:active { transform: scale(0.92); color: #34d399; }
    .btn-play {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #10b981;
      color: #030712;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
    }
    .btn-play:active { transform: scale(0.94); background-color: #34d399; }

    /* 파일 정보 & 보조 메뉴 바 */
    .footer-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #64748b;
      border-top: 1px solid rgba(30, 41, 59, 0.8);
      padding-top: 4px;
    }
    .file-tag {
      color: #cbd5e1;
      font-family: ui-monospace, SFMono-Regular, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 210px;
    }

    /* 재생목록 서랍 (Drawer) */
    #playlist-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 68%;
      background-color: #0f172a;
      border-top: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
      z-index: 50;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    #playlist-drawer.open { transform: translateY(0); }
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .track-list {
      flex: 1;
      overflow-y: auto;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .track-item {
      padding: 12px 16px;
      border-radius: 12px;
      background-color: #1e293b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #cbd5e1;
      transition: background 0.15s;
    }
    .track-item.playing {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- 상단 80%: 순수 학습 자막 뷰 -->
  <main id="lyrics-container">
    <div id="empty-notice" style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #64748b; text-align: center; gap: 8px;">
      <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
      <p style="font-size: 0.95rem; font-weight: 500; color: #94a3b8;">로드된 학습 파일이 없습니다.</p>
      <p style="font-size: 0.75rem;">하단의 [📂 파일불러오기]를 눌러 MP3와 JSON을 선택하세요.</p>
    </div>
  </main>

  <!-- 하단 20%: 통합 컨트롤 바 -->
  <footer>
    <!-- 학습 옵션 (토글 & 배속) -->
    <div class="option-bar">
      <div class="toggle-group">
        <button id="toggle-hanzi" class="btn-toggle active">한자</button>
        <button id="toggle-pinyin" class="btn-toggle active">병음</button>
        <button id="toggle-korean" class="btn-toggle active">해석</button>
      </div>
      <button id="btn-speed" class="btn-speed">1.0x</button>
    </div>

    <!-- 프로그레스 바 -->
    <div class="progress-wrapper">
      <span id="current-time" class="time-text" style="text-align: right;">0:00</span>
      <div id="progress-bar-container" class="progress-bar-bg">
        <div id="progress-bar"></div>
      </div>
      <span id="duration-time" class="time-text">0:00</span>
    </div>

    <!-- 재생 제어 버튼 -->
    <div class="controls">
      <button id="btn-open-drawer" class="btn-ctrl" title="재생목록">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>

      <button id="btn-rewind" class="btn-ctrl" style="font-weight: bold; font-size: 0.85rem;" title="15초 뒤로">
        ⏪ -15s
      </button>
      
      <button id="btn-play-pause" class="btn-ctrl btn-play">
        <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <button id="btn-forward" class="btn-ctrl" style="font-weight: bold; font-size: 0.85rem;" title="15초 앞으로">
        +15s ⏩
      </button>
      
      <button id="btn-next" class="btn-ctrl" title="다음 트랙">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <!-- 파일 정보 및 파일 추가 -->
    <div class="footer-info">
      <div style="display: flex; align-items: center; gap: 6px; overflow: hidden;">
        <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #10b981;"></span>
        <span id="track-filename" class="file-tag">선택된 파일 없음</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="playlist-count" style="font-family: monospace; font-size: 0.75rem;">0 / 0</span>
        <label style="color: #10b981; font-weight: 700; cursor: pointer;">
          📂 파일불러오기
          <input type="file" id="file-input" multiple accept=".mp3,.m4a,.wav,.ogg,.json,audio/*" style="display: none;">
        </label>
      </div>
    </div>
  </footer>

  <!-- 재생목록 슬라이드 서랍 (Drawer) -->
  <div id="drawer-overlay" class="drawer-overlay"></div>
  <div id="playlist-drawer">
    <div class="drawer-header">
      <h3 style="font-size: 1rem; font-weight: 700; color: #f8fafc;">📋 학습 재생목록</h3>
      <button id="btn-close-drawer" style="background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer;">✕</button>
    </div>
    <div id="drawer-track-list" class="track-list"></div>
  </div>

  <audio id="audio-player" preload="auto"></audio>

  <script>
    let playlist = [];
    let currentTrackIndex = 0;
    let currentSentenceIndex = -1;
    const speeds = [0.75, 0.9, 1.0, 1.15, 1.25, 1.5];
    let speedIndex = 2; // 기본 1.0x

    const audio = document.getElementById('audio-player');
    const lyricsContainer = document.getElementById('lyrics-container');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const btnRewind = document.getElementById('btn-rewind');
    const btnForward = document.getElementById('btn-forward');
    const btnNext = document.getElementById('btn-next');
    const btnSpeed = document.getElementById('btn-speed');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-bar-container');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    const trackFilenameEl = document.getElementById('track-filename');
    const playlistCountEl = document.getElementById('playlist-count');
    const fileInput = document.getElementById('file-input');

    // 토글 버튼
    const toggleHanzi = document.getElementById('toggle-hanzi');
    const togglePinyin = document.getElementById('toggle-pinyin');
    const toggleKorean = document.getElementById('toggle-korean');

    // 서랍 엘리먼트
    const btnOpenDrawer = document.getElementById('btn-open-drawer');
    const btnCloseDrawer = document.getElementById('btn-close-drawer');
    const playlistDrawer = document.getElementById('playlist-drawer');
    const drawerOverlay = document.getElementById('drawer-overlay');
    const drawerTrackList = document.getElementById('drawer-track-list');

    // 파일명에서 특수문자/공백/해시태그를 제거하고 순수 영문/숫자/한글/한자만 추출하는 정규화 함수
    function normalizeKey(str) {
      return str
        .toLowerCase()
        .replace(/#\S+/g, '') // #dailychinese 같은 해시태그 제거
        .replace(/\[.*?\]/g, '') // [Learn Chinese with Pipo] 같은 채널 대괄호 제거
        .replace(/[^a-z0-9가-힣\u4e00-\u9fa5]/g, ''); // 특수기호, 공백, 하이픈 전부 제거
    }

    // --- 파일 다중 선택 및 초강력 정규화 매핑 ---
    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      const audioFiles = [];
      const jsonFiles = [];

      files.forEach(f => {
        const ext = f.name.substring(f.name.lastIndexOf('.') + 1).toLowerCase();
        if (['mp3', 'm4a', 'wav', 'ogg'].includes(ext)) audioFiles.push(f);
        else if (ext === 'json') jsonFiles.push(f);
      });

      // 1. 모든 JSON 파일 파싱 및 정규화 키로 저장
      const parsedJsonMap = {};
      await Promise.all(
        jsonFiles.map(async (jf) => {
          try {
            const rawBase = jf.name.substring(0, jf.name.lastIndexOf('.'));
            const normKey = normalizeKey(rawBase);
            const text = await jf.text();
            const data = JSON.parse(text);

            // 비어있는 배열([])이 아닌 실제 문장이 있는 경우만 등록
            if (Array.isArray(data) && data.length > 0) {
              parsedJsonMap[normKey] = data;
              parsedJsonMap[rawBase] = data; // 원본 이름도 보조 등록
            } else {
              console.warn('빈 JSON 파일 감지됨:', jf.name);
            }
          } catch (err) {
            console.error('JSON 파싱 오류:', jf.name, err);
          }
        })
      );

      // 2. 오디오 파일과 1:1 매칭
      const newTracks = [];
      const availableJsonKeys = Object.keys(parsedJsonMap);

      audioFiles.sort((a, b) => a.name.localeCompare(b.name)).forEach(af => {
        const rawBase = af.name.substring(0, af.name.lastIndexOf('.'));
        const normKey = normalizeKey(rawBase);

        // 1순위: 정규화 키 일치, 2순위: 원본명 일치, 3순위: 단일 파일인 경우
        let matchedSentences = parsedJsonMap[normKey] || parsedJsonMap[rawBase];
        
        if (!matchedSentences && audioFiles.length === 1 && availableJsonKeys.length > 0) {
          matchedSentences = parsedJsonMap[availableJsonKeys[0]];
        }

        newTracks.push({
          title: rawBase.replace(/\[.*?\]\s*/g, ''), // 제목에서 채널 대괄호 정리
          filename: af.name,
          audioUrl: URL.createObjectURL(af),
          sentences: matchedSentences || []
        });
      });

      if (newTracks.length > 0) {
        playlist = newTracks;
        loadTrack(0);
        audio.play().catch(() => {});
      } else {
        alert('지원되는 음원 파일(.mp3, .m4a)을 선택해 주세요.');
      }
    });

    // --- 2. 트랙 로드 및 Media Session API 연동 ---
    function loadTrack(index) {
      if (playlist.length === 0) return;
      if (index >= playlist.length) index = 0;

      currentTrackIndex = index;
      currentSentenceIndex = -1;
      const track = playlist[currentTrackIndex];

      audio.src = track.audioUrl;
      audio.playbackRate = speeds[speedIndex];
      trackFilenameEl.textContent = track.filename;
      playlistCountEl.textContent = `${currentTrackIndex + 1} / ${playlist.length}`;

      renderLyrics(track.sentences);
      updateDrawerList();
      updateMediaSession(track);
    }

    // --- 3. iOS 잠금화면 / 제어센터 연동 (Media Session) ---
    function updateMediaSession(track) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: 'C2T 중국어 학습',
          album: `트랙 ${currentTrackIndex + 1} / ${playlist.length}`
        });

        navigator.mediaSession.setActionHandler('play', () => audio.play());
        navigator.mediaSession.setActionHandler('pause', () => audio.pause());
        navigator.mediaSession.setActionHandler('seekbackward', () => {
          audio.currentTime = Math.max(0, audio.currentTime - 15);
        });
        navigator.mediaSession.setActionHandler('seekforward', () => {
          audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15);
        });
        navigator.mediaSession.setActionHandler('previoustrack', () => {
          if (playlist.length > 0) {
            loadTrack(currentTrackIndex > 0 ? currentTrackIndex - 1 : playlist.length - 1);
            audio.play();
          }
        });
        navigator.mediaSession.setActionHandler('nexttrack', () => {
          if (playlist.length > 0) {
            loadTrack(currentTrackIndex + 1);
            audio.play();
          }
        });
      }
    }

    // --- 4. 자막 렌더링 ---
    function renderLyrics(sentences) {
      lyricsContainer.innerHTML = '';
      if (!sentences || sentences.length === 0) {
        lyricsContainer.innerHTML = `
          <div style="height: 100%; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.85rem;">
            연결된 자막 JSON이 없습니다. (음원명과 동일한 .json 파일 필요)
          </div>`;
        return;
      }

      sentences.forEach((s) => {
        const item = document.createElement('div');
        item.id = `sentence-${s.id}`;
        item.className = 'sentence-card';
        item.innerHTML = `
          <div class="hanzi">${s.hanzi}</div>
          <div class="pinyin">${s.pinyin}</div>
          <div class="korean">${s.korean}</div>
        `;
        item.addEventListener('click', () => {
          audio.currentTime = s.start + 0.05;
          if (audio.paused) audio.play();
        });
        lyricsContainer.appendChild(item);
      });
    }

    // --- 5. 정확한 노래방 하이라이트 ---
    function updateActiveSentence(curTime) {
      if (playlist.length === 0) return;
      const sentences = playlist[currentTrackIndex].sentences;
      const matchIndex = sentences.findIndex(s => curTime >= s.start && curTime < s.end);

      if (matchIndex !== currentSentenceIndex) {
        if (currentSentenceIndex !== -1) {
          const prevEl = document.getElementById(`sentence-${currentSentenceIndex}`);
          if (prevEl) prevEl.classList.remove('active');
        }

        currentSentenceIndex = matchIndex;

        if (currentSentenceIndex !== -1) {
          const activeEl = document.getElementById(`sentence-${currentSentenceIndex}`);
          if (activeEl) {
            activeEl.classList.add('active');
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      }
    }

    // --- 6. 서랍 메뉴 관리 ---
    function updateDrawerList() {
      drawerTrackList.innerHTML = '';
      playlist.forEach((track, idx) => {
        const div = document.createElement('div');
        div.className = `track-item ${idx === currentTrackIndex ? 'playing' : ''}`;
        div.innerHTML = `
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 85%;">
            ${idx + 1}. ${track.title}
          </span>
          <span style="font-size: 0.75rem; color: #64748b;">${idx === currentTrackIndex ? '재생중' : ''}</span>
        `;
        div.addEventListener('click', () => {
          loadTrack(idx);
          audio.play();
          closeDrawer();
        });
        drawerTrackList.appendChild(div);
      });
    }

    function openDrawer() { updateDrawerList(); playlistDrawer.classList.add('open'); drawerOverlay.classList.add('open'); }
    function closeDrawer() { playlistDrawer.classList.remove('open'); drawerOverlay.classList.remove('open'); }

    btnOpenDrawer.addEventListener('click', openDrawer);
    btnCloseDrawer.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    // --- 7. 배속 조절 ---
    btnSpeed.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % speeds.length;
      const currentSpeed = speeds[speedIndex];
      audio.playbackRate = currentSpeed;
      btnSpeed.textContent = `${currentSpeed}x`;
    });

    // --- 8. 한자/병음/해석 숨김 토글 ---
    function bindToggle(btn, className) {
      btn.addEventListener('click', () => {
        document.body.classList.toggle(className);
        btn.classList.toggle('active', !document.body.classList.contains(className));
      });
    }
    bindToggle(toggleHanzi, 'hide-hanzi');
    bindToggle(togglePinyin, 'hide-pinyin');
    bindToggle(toggleKorean, 'hide-korean');

    // --- 9. 오디오 제어 핸들러 ---
    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    btnPlayPause.addEventListener('click', () => {
      if (playlist.length === 0) {
        alert("먼저 [📂 파일불러오기]를 눌러 학습할 파일을 선택해 주세요.");
        return;
      }
      audio.paused ? audio.play() : audio.pause();
    });

    audio.addEventListener('play', () => {
      iconPlay.style.display = 'none';
      iconPause.style.display = 'block';
    });

    audio.addEventListener('pause', () => {
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
    });

    btnRewind.addEventListener('click', () => audio.currentTime = Math.max(0, audio.currentTime - 15));
    btnForward.addEventListener('click', () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15));

    btnNext.addEventListener('click', () => {
      if (playlist.length > 0) { loadTrack(currentTrackIndex + 1); audio.play(); }
    });

    audio.addEventListener('ended', () => {
      if (playlist.length > 0) { loadTrack(currentTrackIndex + 1); audio.play(); }
    });

    audio.addEventListener('timeupdate', () => {
      const cur = audio.currentTime;
      const dur = audio.duration || 0;
      currentTimeEl.textContent = formatTime(cur);
      if (dur > 0) progressBar.style.width = `${(cur / dur) * 100}%`;
      updateActiveSentence(cur);
    });

    audio.addEventListener('loadedmetadata', () => {
      durationTimeEl.textContent = formatTime(audio.duration);
    });

    progressContainer.addEventListener('click', (e) => {
      const rect = progressContainer.getBoundingClientRect();
      if (audio.duration) audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });
  </script>
</body>
</html>
